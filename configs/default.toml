[models]
extraction = "gpt-4o-mini"
planning = "gpt-4o-mini"
answer = "gpt-4o"
embedding = "text-embedding-3-small"
temperature = 0.0

[generation]
max_output_tokens = 256
# Add current per-million-token rates to enable cost estimates for API runs.
# input_usd_per_million = 0.0
# output_usd_per_million = 0.0

[chunking]
target_tokens = 500
overlap_tokens = 75

[retrieval]
top_k = 5
graph_hops = 2
max_graph_nodes = 100
max_graph_chunks = 30
bootstrap_replicates = 10000
bootstrap_seed = 20260928

[retrieval.bm25]
k1 = 1.5
b = 0.75

[retrieval.dense]
model = "sentence-transformers/all-MiniLM-L6-v2"
revision = "b8903db39f65d93ae28d49a37c4f3fa90c5f94e0"
cache_path = "data/processed/musique_all_minilm_l6_v2.npz"
batch_size = 64
cpu_threads = 4
candidate_k = 50
rrf_k = 60

[graph.extraction]
papers_per_year = 4
max_passages_per_paper = 10
max_output_tokens = 700
cache_path = "data/processed/graph_extraction_cache.jsonl"
output_path = "data/processed/domain_graph_pilot.jsonl"
summary_path = "data/processed/domain_graph_pilot_summary.json"
# Add current per-million-token rates to enable extraction cost estimates.
# input_usd_per_million = 0.0
# output_usd_per_million = 0.0

[paths]
raw_data = "data/raw"
processed_data = "data/processed"
evaluation_data = "eval/data"

