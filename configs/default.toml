[models]
extraction = "qwen3:4b-instruct"
planning = "qwen3:4b-instruct"
answer = "qwen3:8b"
embedding = "sentence-transformers/all-MiniLM-L6-v2"
temperature = 0.0

[local_llm]
base_url = "http://127.0.0.1:11434"
timeout_seconds = 900
keep_alive = "10m"

[generation]
max_output_tokens = 256
# Answer generation uses local Ollama inference; model API charges are zero.

[chunking]
target_tokens = 500
overlap_tokens = 75

[retrieval]
top_k = 5
graph_hops = 2
max_graph_nodes = 100
max_graph_chunks = 30
bootstrap_replicates = 10000
bootstrap_seed = 20260928

[retrieval.bm25]
k1 = 1.5
b = 0.75

[retrieval.dense]
model = "sentence-transformers/all-MiniLM-L6-v2"
revision = "b8903db39f65d93ae28d49a37c4f3fa90c5f94e0"
cache_path = "data/processed/musique_all_minilm_l6_v2.npz"
batch_size = 64
cpu_threads = 4
candidate_k = 50
rrf_k = 60

[graph.extraction]
papers_per_year = 4
max_passages_per_paper = 10
max_output_tokens = 700
cache_path = "data/processed/graph_extraction_cache.jsonl"
output_path = "data/processed/domain_graph_pilot.jsonl"
summary_path = "data/processed/domain_graph_pilot_summary.json"

[agent]
max_steps = 5
tool_top_k = 5
context_chars_per_passage = 1200
planner_max_output_tokens = 450
dense_cache_path = "data/processed/domain_agent_dense_cache.npz"

[paths]
raw_data = "data/raw"
processed_data = "data/processed"
evaluation_data = "eval/data"

