[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-graphrag"
version = "0.1.0"
description = "A measured multi-hop GraphRAG research project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
papers = ["PyMuPDF>=1.24,<2"]
retrieval = ["sentence-transformers>=3.0,<6"]
neo4j = ["neo4j>=5,<7"]

[project.scripts]
graphrag-smoke = "agentic_graphrag.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

